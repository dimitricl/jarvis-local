included:
  - JarvisLocal/JarvisLocal
  - JarvisLocal/Tests
excluded:
  - JarvisLocal/.build
  - JarvisLocal/.swiftpm

# La CI lance `swiftlint lint --strict` : toute règle active ici doit être verte.
# Règles désactivées = style historique du projet (renommer `db`/`tc`, couper les
# prompts système à 120 colonnes ou réécrire 251 tests = churn sans gain fonctionnel).
# Restent actives les règles anti-crash et d'hygiène : force_unwrapping, force_cast
# (source), trailing_whitespace, etc.
disabled_rules:
  - identifier_name # `db`, `tc`, `df` partout — convention du projet
  - line_length # prompts système et messages FR longs par nature
  - file_length # AppViewModel (~1000 l.) assumé, découpé par MARK
  - function_body_length # runConversationTurn : boucle de tools, pas découpable sans risque
  - type_body_length
  - cyclomatic_complexity # idem : dispatcher execute() + boucle de tour
  - large_tuple
  - type_name # noms de classes de tests verbeux mais explicites
  - force_cast # tests uniquement (source : zéro occurrence)
  - force_try # tests uniquement (source : zéro occurrence)
  - shorthand_operator # inapplicable à SwiftUI.Text (pas de +=)
  - multiple_closures_with_trailing_closure # idiome SwiftUI (Button { } label: { })
