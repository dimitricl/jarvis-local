name: multi-07-bash-pipeline
category: multi
prompt: "Via bash, liste les fichiers, compte-les, et ecris le nombre dans compte.txt."
allowed_tools: [bash, write_file]
assert:
  type: file_contains
  path: "compte.txt"
  text: "5"
env:
  files:
    f1.txt: "1"
    f2.txt: "2"
    f3.txt: "3"
    f4.txt: "4"
    f5.txt: "5"
