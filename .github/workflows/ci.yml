name: CI

on:
  push:
    branches: [main]
    # Sans ça, un push de tag ne déclenche RIEN : le job `release`
    # (conditionné à refs/tags/v) ne tournait jamais (constaté : v0.7.0
    # tagué, aucune Release publiée).
    tags: ['v*']
  pull_request:
    branches: [main]

# Création de Release via gh CLI : écriture requise sur contents.
permissions:
  contents: write

defaults:
  run:
    working-directory: JarvisLocal

jobs:
  lint:
    name: SwiftLint
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Lint
        # Depuis la RACINE du repo : les chemins included/excluded du
        # .swiftlint.yml y sont relatifs. Lancé depuis JarvisLocal/, les
        # exclusions (.build, checkouts SwiftSoup) cassent et 9000+ violations
        # parasites font échouer --strict (constaté en réel).
        run: swiftlint lint --strict
        working-directory: ./

  build-and-test:
    name: Build & Test
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: swift build

      - name: Test
        run: swift test

  release:
    name: Release (hardened)
    needs: [lint, build-and-test]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-26
    # `secrets` est INTERDIT dans les `if:` de steps (rejet du workflow à la
    # création, 0 job) : on l'évalue une fois ici en `env`, les steps testent env.
    env:
      HAS_DEV_ID: ${{ secrets.APPLE_DEV_ID != '' }}
      HAS_NOTARY: ${{ secrets.APPLE_APP_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Release build
        run: swift build -c release

      - name: Sign (hardened runtime + entitlements)
        # Sans secret APPLE_DEV_ID : signature ad-hoc (valide la structure,
        # pas la distribution). Avec le secret : Developer ID, distribuable.
        run: |
          IDENTITY="${{ secrets.APPLE_DEV_ID }}"
          if [ -z "$IDENTITY" ]; then IDENTITY="-"; fi
          codesign -s "$IDENTITY" --options runtime --timestamp \
            --entitlements JarvisLocal.entitlements \
            .build/release/JarvisLocal

      - name: Verify signature & entitlements
        run: |
          codesign --verify --deep --strict .build/release/JarvisLocal
          codesign -d --entitlements - .build/release/JarvisLocal | grep -q apple-events

      - name: Assemble app bundle
        # run.sh fait pareil en local (install), ici on assemble sans installer
        # ni lancer : la notarisation exige un .app (ou .dmg/.pkg), pas un binaire nu.
        run: |
          rm -rf JarvisLocal.app
          mkdir -p JarvisLocal.app/Contents/MacOS JarvisLocal.app/Contents/Resources
          cp .build/release/JarvisLocal JarvisLocal.app/Contents/MacOS/JarvisLocal
          cp -R JarvisLocal/Resources/* JarvisLocal.app/Contents/Resources/ 2>/dev/null || true
          cp JarvisLocal/Info.plist JarvisLocal.app/Contents/Info.plist
          VERSION="${GITHUB_REF_NAME#v}"
          plutil -replace CFBundleShortVersionString -string "$VERSION" JarvisLocal.app/Contents/Info.plist
          plutil -replace CFBundleVersion -string "$VERSION" JarvisLocal.app/Contents/Info.plist
          codesign -s "${{ secrets.APPLE_DEV_ID }}" --options runtime --timestamp \
            --entitlements JarvisLocal.entitlements --deep JarvisLocal.app
          codesign --verify --deep --strict JarvisLocal.app
          ditto -c -k --keepParent JarvisLocal.app JarvisLocal.zip
        if: env.HAS_DEV_ID == 'true'

      - name: Notarize & staple
        # Requiert : APPLE_DEV_ID (Developer ID), APPLE_ID + APPLE_TEAM_ID +
        # APPLE_APP_PASSWORD (mot de passe spécifique notarytool). Sans ces secrets,
        # l'étape est sautée : le zip signé reste téléchargeable en artefact.
        if: env.HAS_NOTARY == 'true'
        run: |
          xcrun notarytool submit JarvisLocal.zip \
            --apple-id "${{ secrets.APPLE_ID }}" \
            --team-id "${{ secrets.APPLE_TEAM_ID }}" \
            --password "${{ secrets.APPLE_APP_PASSWORD }}" --wait
          xcrun stapler staple JarvisLocal.app
          ditto -c -k --keepParent JarvisLocal.app JarvisLocal.zip

      - name: Upload artefact
        uses: actions/upload-artifact@v4
        with:
          name: JarvisLocal-${{ github.ref_name }}
          path: JarvisLocal/JarvisLocal.zip
        if: env.HAS_DEV_ID == 'true'

      - name: Create GitHub Release
        # Avant, le job ne faisait qu'uploader un artefact : aucune entrée
        # n'apparaissait dans l'onglet Releases. Idempotent : un re-run
        # upload vers la release existante au lieu d'échouer.
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name }}"
          ASSETS=""
          [ -f JarvisLocal/JarvisLocal.zip ] && ASSETS="JarvisLocal/JarvisLocal.zip"
          if gh release view "$TAG" >/dev/null 2>&1; then
            # shellcheck disable=SC2086
            [ -n "$ASSETS" ] && gh release upload "$TAG" $ASSETS --clobber || true
          else
            # shellcheck disable=SC2086
            gh release create "$TAG" $ASSETS --title "$TAG" --generate-notes
          fi

      - name: Smoke test (automation stack du runner)
        # Pas de lancement GUI en CI (un binaire SwiftUI pendrait sans session Aqua) :
        # on valide que la pile AppleScript répond et que le binaire lié démarre
        # son runtime (dyld + chargement) sans aller jusqu'au runloop.
        run: |
          osascript -e 'tell application "Finder" to get name'
          # Insensible à la casse : le binaire lie libswiftCore.dylib (s minuscule).
          otool -L .build/release/JarvisLocal | grep -qi swiftcore
